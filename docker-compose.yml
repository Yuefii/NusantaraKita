version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nusantarakita_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nusantarakita
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./data/mysql/nusakita.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    image: yuefii/nusantarakita-api:latest
    container_name: nusantarakita_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DB: nusantarakita
    depends_on:
      db:
        condition: service_healthy

  docs:
    build: ./docs
    container_name: nusantarakita_docs
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./docs:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/v2/

volumes:
  db_data:
